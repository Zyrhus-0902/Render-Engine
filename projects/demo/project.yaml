# One folder per architecture project. Copy projects/_template to projects/<name>.
name: Demo Pavilion
style: exterior_day             # default style for this project

site:
  latitude: 12.9716             # used by sun mode: solar
  longitude: 77.5946
  timezone: Asia/Kolkata
  north_angle_deg: 0            # from SketchUp: Window > Model Info > Geo-location / Solar North
  ground_z_m: 0.0               # finished ground level in the model, for eye-height locking

# Uncomment if the first alignment overlay shows the model scaled or rotated.
# model:
#   scale: 1.0
#   axis_forward: "-Z"
#   axis_up: "Y"

# Per-view exceptions. Keep these rare: every exception is an inconsistency.
# scene_overrides:
#   "INT-02 Kitchen":
#     ground_z_m: 3.2
#     camera: {lens_policy: fixed, lens_mm: 18}

# Project-level tweaks to the chosen style (merged over config/styles/<style>.yaml).
# style_settings:
#   sun: {mode: solar, date: "2026-03-21", time: "10:30"}
