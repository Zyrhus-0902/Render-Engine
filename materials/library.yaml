# Studio material library: the single source of truth for how surfaces look.
#
# Name SketchUp materials exactly after these ids (e.g. "CONC_BOARDFORM").
# The SketchUp colour/texture is only for modelling; at render time it is
# replaced by the definition here, so the same material looks identical in
# every view and every project.
#
# Fields (all optional except base_color):
#   type:          principled (default) | glass
#   base_color:    sRGB hex. Used when there is no base_color texture.
#   roughness, metallic, ior, specular, coat, alpha
#   emission_color / emission_strength
#   textures:      {base_color, roughness, metallic, normal | bump} paths relative to materials/
#   size_m:        [width, height] real-world size of one texture tile
#   projection:    box (world-space, default: continuous across objects) | uv (use SketchUp UVs)
#   rotation_deg:  texture rotation around Z
#
# Keep albedos physically plausible (nothing brighter than ~#F0F0F0 except
# lights), otherwise exposure stops being comparable between projects.

materials:
  # --- neutral / massing ------------------------------------------------------
  MASSING_WHITE:
    base_color: "#E6E6E3"
    roughness: 0.9
  PLASTER_WHITE:
    base_color: "#DCD9D2"
    roughness: 0.85
  PAINT_WARM_WHITE:
    base_color: "#E3DDD0"
    roughness: 0.7

  # --- masonry ----------------------------------------------------------------
  CONC_EXPOSED:
    base_color: "#9C9A95"
    roughness: 0.8
    # textures:
    #   base_color: textures/conc_exposed/albedo.jpg
    #   roughness:  textures/conc_exposed/roughness.jpg
    #   normal:     textures/conc_exposed/normal.png
    # size_m: [2.0, 2.0]
  CONC_BOARDFORM:
    base_color: "#8F8C86"
    roughness: 0.85
    size_m: [2.4, 1.2]
  BRICK_WIRECUT_RED:
    base_color: "#8A4A36"
    roughness: 0.85
    size_m: [1.2, 0.6]
  BRICK_EXPOSED_INDIAN:
    base_color: "#9A5440"
    roughness: 0.9
    size_m: [1.15, 0.6]
  STONE_LIMESTONE:
    base_color: "#C9BFA8"
    roughness: 0.75
    size_m: [1.2, 0.6]
  STONE_KOTA_BLUE:
    base_color: "#6E7472"
    roughness: 0.55
    size_m: [0.6, 0.6]
  STONE_GRANITE_BLACK:
    base_color: "#2B2B2B"
    roughness: 0.25
    size_m: [0.6, 0.6]
  TILE_TERRAZZO:
