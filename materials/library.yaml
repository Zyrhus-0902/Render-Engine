  # --- timber -----------------------------------------------------------------
  WOOD_TEAK:
    base_color: "#7A4E2D"
    roughness: 0.55
    size_m: [2.0, 0.3]
  WOOD_OAK_FLOOR:
    base_color: "#A97C50"
    roughness: 0.45
    size_m: [2.0, 1.0]
  WOOD_CEDAR_CLADDING:
    base_color: "#9A6A43"
