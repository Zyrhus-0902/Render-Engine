<title>Project Enquiry Log</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: conversational questionnaire on the left, the project profile reading as a document on the right; one column on phones. */
:root {
  --paper: #f5f6f2;
  --sheet: #ffffff;
  --ink: #1d2420;
  --muted: #5d6a63;
  --rule: #d9ded8;
  --accent: #2f5d50;
  --accent-soft: #e3ece7;
  --tension: #8a5a12;
  --tension-soft: #f7ecd9;
  --display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #141a17; --sheet: #1b2320; --ink: #e4ebe6; --muted: #9aa8a0; --rule: #2e3a35;
  --accent: #7fbfa8; --accent-soft: #23352e; --tension: #e2b46a; --tension-soft: #3a2e1b; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #141a17; --sheet: #1b2320; --ink: #e4ebe6; --muted: #9aa8a0; --rule: #2e3a35;
  --accent: #7fbfa8; --accent-soft: #23352e; --tension: #e2b46a; --tension-soft: #3a2e1b; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 16px/1.55 var(--body); margin: 0; }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; margin-bottom: 20px; }
h1 { font: 800 clamp(28px, 4vw, 40px)/1.05 var(--display); font-stretch: 80%; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--muted); margin: 6px 0 0; max-width: 62ch; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: 600 14px var(--body); border: 1px solid var(--rule); background: var(--sheet); color: var(--ink);
  padding: 8px 14px; border-radius: 6px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--sheet); }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 520px); gap: 28px; align-items: start; }
@media (max-width: 960px) { .grid { grid-template-columns: minmax(0, 1fr); } }

form { display: grid; gap: 16px; }
section.q { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 18px 20px 20px; display: grid; gap: 14px; min-width: 0; }
section.q h2 { font: 700 22px/1.2 var(--display); font-stretch: 85%; margin: 0; text-wrap: balance; }
section.q .lede { color: var(--muted); margin: -8px 0 0; font-size: 15px; }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px 16px; }
.f { display: grid; gap: 4px; min-width: 0; }
label, .lbl { font-weight: 600; font-size: 14px; }
input, textarea { font: 15px var(--body); color: var(--ink); background: var(--paper); border: 1px solid var(--rule);
  border-radius: 6px; padding: 8px 10px; width: 100%; min-width: 0; }
textarea { min-height: 70px; resize: vertical; line-height: 1.5; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips label { font-weight: 400; font-size: 14px; display: inline-flex; align-items: center; border: 1px solid var(--rule);
  border-radius: 999px; padding: 4px 12px; cursor: pointer; background: var(--paper); user-select: none; }
.chips input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.chips label:has(input:checked) { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.chips label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }

aside { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); display: grid; gap: 12px; }
@media (max-width: 960px) { aside { position: static; } }
.doc { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 26px 28px; max-height: calc(100vh - 120px); overflow: auto; min-width: 0; }
@media (max-width: 960px) { .doc { max-height: none; } }
.doc .eyebrow { font: 700 12px var(--display); text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); }
.doc h3 { font: 800 30px/1.1 var(--display); font-stretch: 80%; margin: 4px 0 2px; }
.doc .meta { color: var(--muted); margin: 0 0 14px; }
.doc .ask { font-size: 19px; line-height: 1.45; font-style: italic; border-left: 3px solid var(--accent); padding-left: 14px; margin: 0 0 8px; max-width: 46ch; }
.doc h4 { font: 700 13px var(--display); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 22px 0 6px; }
.doc p { margin: 0 0 6px; max-width: 62ch; }
.doc ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.doc .tags { color: var(--accent); font-weight: 600; }
.empty { color: var(--muted); font-style: italic; }

.ideas { display: grid; gap: 6px; }
.idea { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 6px; background: var(--accent-soft); cursor: pointer; }
.idea.t { background: var(--tension-soft); }
.idea input { width: auto; padding: 0; margin: 4px 0 0; accent-color: var(--accent); flex: none; }
.idea.off { opacity: 0.5; }
.idea.off span { text-decoration: line-through; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toast { font-size: 13px; color: var(--accent); min-height: 1.2em; }
.banner { font-size: 14px; background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 6px; padding: 8px 12px; margin-bottom: 16px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Project Enquiry Log</h1>
      <p class="sub">A profile of the project after the first conversation: who the client is, how they live, the site, the fixed points and the feeling they want. It becomes the starting context for predesign and the first schemes.</p>
    </div>
    <div class="tools">
      <button type="button" id="btn-example">Load House T01</button>
      <button type="button" id="btn-clear">Start a new enquiry</button>
    </div>
  </header>
  <div class="banner" id="banner" hidden></div>
  <div class="grid">
    <form id="form" autocomplete="off"></form>
    <aside>
      <article class="doc" id="doc" aria-live="polite"></article>
      <div class="actions">
        <button type="button" class="primary" id="btn-claude">Copy for Claude</button>
        <button type="button" id="btn-copy">Copy profile only</button>
        <span class="toast" id="toast" role="status"></span>
      </div>
    </aside>
  </div>
</div>

<script>
// Each section is one conversation topic. "chips" are quick picks; text fields hold the client's own words.
const SECTIONS = [
  { id: "project", title: "The project", lede: "Just enough to place it.", fields: [
    { row: [
      { id: "code", label: "Project code", ph: "House T01" },
      { id: "type", label: "Type", ph: "Private residence" },
      { id: "location", label: "Location", ph: "Tirupur" },
    ]},
    { row: [
      { id: "plot", label: "Plot", ph: "90 cents" },
      { id: "built", label: "Built extent", ph: "about 20 cents, single floor" },
    ]},
    { id: "ask", label: "The ask, in one line", type: "textarea", ph: "What are they really asking for?" },
  ]},
  { id: "client", title: "The client and how they live", lede: "The people behind the brief shape the plan more than the room list.", fields: [
    { id: "who", label: "Who are they?", type: "textarea", ph: "Family, ages, work, where they live now, what they like about it and what they want to leave behind" },
    { id: "living", label: "How they live", type: "chips", options: ["Entertain often", "Quiet and private", "Multi-generational", "Young children", "Large family functions", "Sporty / active", "Car enthusiasts", "Work from home", "Live-in staff", "Weekend home"] },
    { id: "day", label: "A day in the house", type: "textarea", ph: "Mornings, where they gather, what happens in the evenings, guests, rituals" },
  ]},
  { id: "site", title: "The site", lede: "What the place offers, and what it asks of the house.", fields: [
    { id: "character", label: "Site character", type: "chips", options: ["Open land around", "Neighbours close by", "Busy road edge", "Quiet approach", "Mature trees", "Flat", "Sloping", "Distant views", "Views to be made within the plot", "Hot, dry sun"] },
    { id: "site_notes", label: "What's around it", type: "textarea", ph: "Approach, orientation if known, best views, what to screen, existing trees or structures" },
  ]},
  { id: "program", title: "What they asked for", lede: "In their words. Areas come later.", fields: [
    { id: "spaces", label: "Spaces", type: "textarea", ph: "Bedrooms, living, kitchen, anything they described" },
    { id: "also", label: "Also mentioned", type: "chips", options: ["Puja", "Guest suite", "Home office", "Gym", "Pool", "Home theatre", "Courtyard", "Staff / driver rooms", "Verandahs"] },
    { id: "outdoor", label: "Outdoors", type: "textarea", ph: "Landscape, sport, parking, play, gatherings" },
  ]},
  { id: "fixed", title: "Fixed points", lede: "What can't move. Everything else is open to design.", fields: [
    { id: "fixed", label: "Fixed", type: "chips", options: ["Vastu sketch to follow", "Single floor only", "Budget sensitive", "Fast timeline", "Elderly-friendly", "Existing structure to keep", "Tight approvals"] },
    { id: "fixed_notes", label: "Notes", type: "textarea", ph: "Who set them, how firm they are" },
  ]},
  { id: "feel", title: "The feeling", lede: "What the house should be like to live in.", fields: [
    { id: "words", label: "In their words", type: "textarea", ph: "Phrases they used, things they keep returning to" },
    { id: "mood", label: "Mood", type: "chips", options: ["Open", "Glassy", "Light", "Calm", "Grounded", "Earthy", "Bold", "Minimal", "Warm", "Tropical", "Timeless"] },
    { id: "landscape", label: "House and landscape", type: "chips", options: ["Landscape pulled inside", "Pavilion in a garden", "Courtyards", "Framed views", "Deep verandahs", "Inward looking"] },
    { id: "freedom", label: "How they brief", type: "chips", options: ["Free hand", "Wants to see options", "Has firm ideas"] },
    { id: "refs", label: "References they shared", ph: "Images, houses, places they love" },
  ]},
  { id: "read", title: "Our first read", lede: "The studio's instinct, while the conversation is fresh.", fields: [
    { id: "idea", label: "First instinct / big idea", type: "textarea", ph: "What this house could be" },
    { id: "next", label: "To talk about next time", type: "textarea", ph: "Questions for the next meeting" },
  ]},
];

const EXAMPLE = {
  code: "House T01", type: "Private residence", location: "Tirupur", plot: "90 cents", built: "about 20 cents, all on the ground floor",
  ask: "A one-of-a-kind single-storey home with a lot of glass, so the house feels open and the landscape becomes part of every room.",
  spaces: "Four bedrooms, one living, a wet and a dry kitchen with a dining area.",
  outdoor: "About 70 cents of designed landscape, a basketball court, parking for 10 cars.",
  fixed: ["Vastu sketch to follow", "Single floor only"],
  fixed_notes: "Planning follows the sketch from the client's Vastu consultant.",
  words: "A lot of glass, used so the house feels very open and the views of the landscape come into the rooms. The rest is ours to design, one of a kind.",
  mood: ["Open", "Glassy", "Light"], landscape: ["Landscape pulled inside"], freedom: ["Free hand"],
};

// Starting points the profile suggests. Each can be kept or dropped.
function suggestions(v) {
  const has = (k, o) => (v[k] || []).includes(o);
  const txt = Object.values(v).flat().join(" ").toLowerCase();
  const open = has("mood", "Open") || has("mood", "Glassy") || has("landscape", "Landscape pulled inside") || /glass/.test(txt);
  const vastu = has("fixed", "Vastu sketch to follow");
  const single = has("fixed", "Single floor only") || /single floor|single-storey|ground floor/.test(txt);
  const court = /basketball|court/.test(txt);
  const cars = has("living", "Car enthusiasts") || /\b([5-9]|\d\d+) cars\b/.test(txt);
  const d = [], t = [], q = [];

  if (open) d.push("Landscape as the fourth wall: every main space opens to a garden it owns.");
  if (single) d.push("A spread single level: pavilions linked by courtyards and verandahs rather than one large block.");
  if (vastu) d.push("Vastu sets the zoning. The design freedom is in the section, the roof, the edges and how each zone opens out.");
  if (court) d.push("The court as an outdoor room: visible from living, but kept out of the main view.");
  if (cars) d.push("Arrival as a designed car court, screened from the gardens, so parking doesn't take the landscape.");
  if (has("living", "Entertain often") || has("living", "Large family functions")) d.push("Living spills onto a lawn or deck for gatherings.");
  if (has("living", "Multi-generational")) d.push("Separate wings so generations share the centre and keep their privacy.");

  if (open) t.push("Openness vs. sun and heat: deep overhangs, verandahs and planting let the glass stay open without overheating.");
  if (open) t.push("Openness vs. privacy and security at night, especially toward the road and service areas.");
  if (vastu && open) t.push("Fixed Vastu positions vs. a flowing open plan.");
  if (cars && court) t.push("Court and parking are large hard surfaces. Placing them decides how green the plot feels.");

  if (!v.who) q.push("Who will live here, and what does a normal day look like?");
  if (!v.site_notes && !(v.character || []).length) q.push("Which way does the plot face, how do you arrive, and where are the best views?");
  if (!v.refs) q.push("A few homes or images they love, to calibrate “one of a kind”.");
  if (vastu) q.push("Sit with the Vastu consultant early: which parts of the sketch can flex?");
  if (open) q.push("Budget comfort, so the glass and spans stay realistic.");
  if (vastu && !has("also", "Puja")) q.push("A puja room wasn't mentioned. Vastu plans usually have one.");
  return { d, t, q };
}

const ALL = SECTIONS.flatMap(s => s.fields.flatMap(f => f.row || [f]));
const form = document.getElementById("form");
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function ctl(f) {
  const ph = f.ph ? ` placeholder="${esc(f.ph)}"` : "";
  if (f.type === "chips") return `<div class="f"><span class="lbl">${f.label}</span><div class="chips" role="group" aria-label="${esc(f.label)}">${f.options.map((o, i) => `<label><input type="checkbox" id="f-${f.id}-${i}" name="${f.id}" value="${esc(o)}">${esc(o)}</label>`).join("")}</div></div>`;
  const input = f.type === "textarea" ? `<textarea id="f-${f.id}" name="${f.id}"${ph}></textarea>` : `<input id="f-${f.id}" name="${f.id}" type="text"${ph}>`;
  return `<div class="f"><label for="f-${f.id}">${f.label}</label>${input}</div>`;
}
form.innerHTML = SECTIONS.map(s => `<section class="q"><h2>${s.title}</h2><p class="lede">${s.lede}</p>${s.fields.map(f => f.row ? `<div class="row2">${f.row.map(ctl).join("")}</div>` : ctl(f)).join("")}</section>`).join("");

let dropped = new Set();
function read() {
  const v = {};
  for (const f of ALL) v[f.id] = f.type === "chips" ? [...form.querySelectorAll(`input[name="${f.id}"]:checked`)].map(i => i.value) : form.elements[f.id].value.trim();
  return v;
}
function write(v) {
  form.reset();
  for (const f of ALL) {
    if (v[f.id] == null) continue;
    if (f.type === "chips") form.querySelectorAll(`input[name="${f.id}"]`).forEach(i => { i.checked = v[f.id].includes(i.value); });
    else form.elements[f.id].value = v[f.id];
  }
}

// One structure feeds both the on-page document and the copied Markdown.
function profile(v) {
  const s = suggestions(v);
  const keep = (k, list) => list.filter(x => !dropped.has(k + x));
  const join = a => (a || []).join(", ");
  const blocks = [];
  const add = (h, items) => { items = items.filter(Boolean); if (items.length) blocks.push({ h, items }); };
  add("The client", [v.who && { p: v.who }, (v.living || []).length && { tags: join(v.living) }, v.day && { p: v.day }]);
  add("The site", [(v.character || []).length && { tags: join(v.character) }, v.site_notes && { p: v.site_notes }]);
  add("What they asked for", [v.spaces && { p: v.spaces }, (v.also || []).length && { p: "Also: " + join(v.also) + "." }, v.outdoor && { p: v.outdoor }]);
  add("Fixed points", [(v.fixed || []).length && { tags: join(v.fixed) }, v.fixed_notes && { p: v.fixed_notes }]);
  add("The feeling", [v.words && { p: v.words }, [...(v.mood || []), ...(v.landscape || []), ...(v.freedom || [])].length && { tags: join([...(v.mood || []), ...(v.landscape || []), ...(v.freedom || [])]) }, v.refs && { p: "References: " + v.refs }]);
  add("Starting points", keep("d", s.d).map(x => ({ li: x })));
  add("Tensions to resolve", keep("t", s.t).map(x => ({ li: x })));
  add("Our first read", [v.idea && { p: v.idea }]);
  add("For the next conversation", [...(v.next ? [{ p: v.next }] : []), ...keep("q", s.q).map(x => ({ li: x }))]);
  return { s, blocks };
}

function toMarkdown(v, blocks) {
  const meta = [v.type, v.location, v.plot && `${v.plot} plot`, v.built && `built ${v.built}`].filter(Boolean).join(" · ");
  const L = [`# ${v.code || "New enquiry"}`, ""];
  if (meta) L.push(`*${meta}*`, "");
  if (v.ask) L.push(`> ${v.ask}`, "");
  for (const b of blocks) {
    L.push(`## ${b.h}`);
    for (const it of b.items) it.li ? L.push(`- ${it.li}`) : L.push(it.tags ? `**${it.tags}**` : it.p.replace(/\n+/g, " "), "");
    L.push("");
  }
  return L.join("\n").replace(/\n{3,}/g, "\n\n").trim() + "\n";
}

function ideaList(kind, list, cls) {
  return `<div class="ideas">${list.map(x => { const k = kind + x, off = dropped.has(k);
    return `<label class="idea ${cls} ${off ? "off" : ""}"><input type="checkbox" data-k="${esc(k)}" ${off ? "" : "checked"}><span>${esc(x)}</span></label>`; }).join("")}</div>`;
}

let md = "";
function update() {
  const v = read();
  const { s, blocks } = profile(v);
  md = toMarkdown(v, blocks);
  const meta = [v.type, v.location, v.plot && `${v.plot} plot`, v.built && `built ${v.built}`].filter(Boolean).join(" · ");
  let h = `<div class="eyebrow">Project profile</div><h3>${esc(v.code || "New enquiry")}</h3>${meta ? `<p class="meta">${esc(meta)}</p>` : ""}`;
  h += v.ask ? `<p class="ask">${esc(v.ask)}</p>` : `<p class="empty">Add the ask in one line to open the profile.</p>`;
  for (const b of blocks) {
    if (b.h === "Starting points") { h += `<h4>Starting points</h4>` + ideaList("d", s.d, ""); continue; }
    if (b.h === "Tensions to resolve") { h += `<h4>Tensions to resolve</h4>` + ideaList("t", s.t, "t"); continue; }
    h += `<h4>${b.h}</h4>`;
    const lis = b.items.filter(i => i.li), rest = b.items.filter(i => !i.li);
    h += rest.map(i => i.tags ? `<p class="tags">${esc(i.tags)}</p>` : `<p>${esc(i.p)}</p>`).join("");
    if (b.h === "For the next conversation" && s.q.length) h += ideaList("q", s.q, "");
    else if (lis.length) h += `<ul>${lis.map(i => `<li>${esc(i.li)}</li>`).join("")}</ul>`;
  }
  // Show dropped suggestion groups too, so they can be brought back.
  if (!blocks.some(b => b.h === "Starting points") && s.d.length) h += `<h4>Starting points</h4>` + ideaList("d", s.d, "");
  if (!blocks.some(b => b.h === "Tensions to resolve") && s.t.length) h += `<h4>Tensions to resolve</h4>` + ideaList("t", s.t, "t");
  $("doc").innerHTML = h;
  try { localStorage.setItem("enquiry-profile", JSON.stringify({ v, dropped: [...dropped] })); } catch (e) {}
}

$("doc").addEventListener("change", e => {
  const k = e.target.dataset.k; if (!k) return;
  e.target.checked ? dropped.delete(k) : dropped.add(k); update();
});

function toast(t) { $("toast").textContent = t; clearTimeout(toast.t); toast.t = setTimeout(() => $("toast").textContent = "", 3000); }
async function copy(text, done) {
  try { await navigator.clipboard.writeText(text); toast(done); }
  catch (e) { const r = document.createRange(); r.selectNodeContents($("doc")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Copy was blocked. The profile is selected: press Ctrl+C / ⌘C."); }
}
const slug = s => (s || "new-enquiry").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

let saved = null;
try { saved = JSON.parse(localStorage.getItem("enquiry-profile") || "null"); } catch (e) {}
if (saved) { write(saved.v); dropped = new Set(saved.dropped || []); }
else { write(EXAMPLE); $("banner").hidden = false; $("banner").textContent = "Showing House T01 as a filled example. Start a new enquiry to log the next one; your draft is kept in this browser."; }

form.addEventListener("input", update);
form.addEventListener("change", update);
form.addEventListener("submit", e => e.preventDefault());
$("btn-clear").addEventListener("click", () => { write({}); dropped = new Set(); $("banner").hidden = true; update(); toast("Ready for a new enquiry."); });
$("btn-example").addEventListener("click", () => { write(EXAMPLE); dropped = new Set(); update(); toast("House T01 loaded."); });
$("btn-copy").addEventListener("click", () => copy(md, "Profile copied."));
$("btn-claude").addEventListener("click", () => {
  const v = read();
  copy(`Log this enquiry as a new project: save it as projects/${slug(v.code)}/brief.md (copy projects/_template for the rest). Then use it as the context for predesign: suggest a few scheme directions and what to ask the client next.\n\n${md}`, "Copied with instructions. Paste it into Claude.");
});
update();
</script>
